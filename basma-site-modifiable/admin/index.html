<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Administration · Basma IYY</title>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>
  <script src="https://unpkg.com/decap-cms@3.18.0/dist/decap-cms.js"></script>
  <script>
    // Après l'invitation par e-mail, redirige vers l'écran de création du mot de passe
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on('init', function (user) {
        if (!user) window.netlifyIdentity.on('login', function () { document.location.href = '/admin/'; });
      });
    }
  </script>
</body>
</html>
