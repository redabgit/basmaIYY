<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{page_title}}</title>
<meta name="description" content="{{page_desc}}">
<link rel="icon" type="image/png" href="{{root}}images/logo.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{root}}css/style.css">
</head>
<body>

<header>
  <div class="wrap header-inner">
    <a href="{{root}}index.html" class="logo"><img src="{{root}}images/logo.png" alt="Logo Basma IYY" width="38" height="38"><span class="brand"><span class="brand-basma">Basma</span> <span class="brand-i">I</span><span class="brand-y1">Y</span><span class="brand-y2">Y</span></span></a>

    <button class="menu-toggle" id="menu-toggle" aria-expanded="false" aria-controls="nav-panel" aria-label="Ouvrir le menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>

    <div class="nav-panel" id="nav-panel">
      <nav class="main-nav">
        <a href="{{root}}index.html#association">L'association</a>
        <a href="{{root}}projets.html" class="nav-gold">Nos projets</a>
        <a href="{{root}}boutique.html">Boutique</a>
        <a href="{{root}}actualites.html">Actualités</a>
        <a href="{{root}}index.html#contact">Contact</a>
      </nav>
      <div class="header-actions">
        <a href="{{root}}benevole.html" class="btn btn-outline btn-small">Devenir bénévole</a>
        <a href="{{root}}don.html" class="btn btn-primary btn-small">Faire un don</a>
      </div>
    </div>
  </div>
</header>

<script>
  (function () {
    var toggle = document.getElementById('menu-toggle');
    var panel = document.getElementById('nav-panel');
    if (!toggle || !panel) return;
    toggle.addEventListener('click', function () {
      var isOpen = panel.classList.toggle('open');
      toggle.setAttribute('aria-expanded', String(isOpen));
    });
    panel.querySelectorAll('a').forEach(function (link) {
      link.addEventListener('click', function () {
        panel.classList.remove('open');
        toggle.setAttribute('aria-expanded', 'false');
      });
    });
  })();
</script>
